# PRESET: Iosevka — angosta, densa (tu original)
font_family        family="Iosevka Nerd Font Mono" style="Regular"
bold_font          family="Iosevka Nerd Font Mono" style="Bold"
italic_font        auto
bold_italic_font   auto
font_size 15
modify_font cell_width  100%
modify_font cell_height 95%
modify_font baseline 0
modify_font underline_position  2
modify_font underline_thickness 70%
disable_ligatures always
