# PRESET: Cascadia Code (Microsoft) — ligaduras. Tu build NF Mono SOLO trae Regular,
# así que NO acepta Medium/Light (kitty sintetiza bold/italic).
font_family        family="CaskaydiaCove Nerd Font Mono" features="+calt +liga"
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size 13
modify_font cell_width  100%
modify_font cell_height 100%
modify_font baseline 0
modify_font underline_position  2
modify_font underline_thickness 70%
disable_ligatures never
