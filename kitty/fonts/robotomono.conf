# PRESET: RobotoMono — Roboto Mono — limpia y neutra
font_family        family="RobotoMono Nerd Font Mono" style="Regular"
bold_font          family="RobotoMono Nerd Font Mono" style="Bold"
italic_font        auto
bold_italic_font   auto
font_size 13
modify_font cell_width  90%
modify_font cell_height 100%
modify_font baseline 0
modify_font underline_position  2
modify_font underline_thickness 70%
disable_ligatures always
